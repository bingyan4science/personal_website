# Home-page News. Newest first. `html` may contain links/markup.
- date: "Aug 2026"
  html: >-
    <a href="https://huggingface.co/papers/2607.28618"><em>AskChem</em></a>
    was accepted to EMNLP 2026 System Demonstrations. AskChem turns 147K
    chemistry papers into 2.4M searchable, source-grounded claims. In the first week of its
    <a href="https://x.com/bingyan4science/status/2085108389890195565">launch</a>
    AskChem has received traffic from 2.9K unique IPs and served 24K HTTP requests.
    Explore the
    <a href="https://askchem.org/">live system</a> or watch the
    <a href="https://www.youtube.com/watch?v=SOjueOlPS-8">video demo</a>.

- date: "Aug 2026"
  html: >-
    <a href="/reasonflow.pdf"><em>ReasonFlow</em></a> was accepted to Findings
    of EMNLP 2026. ReasonFlow shapes the flow-matching trajectories with intermediate
    chain-of-thought anchor states.

- date: "Feb 6, 2026"
  html: >-
    Received a <strong>Poster Award</strong> at the Gordon Research Conference on
    AI for Materials, Energy, and Chemical Sciences for
    <em>EVA-Flow: A Unified Environment-Aware Generative Model for 3D Molecular Conformations</em>.

- date: "Aug 8, 2025"
  html: >-
    Our <a href="https://pubs.rsc.org/en/content/articlelanding/2025/dd/d5dd00176e">Consistency paper</a>
    is out in <em>Digital Discovery</em>. We evaluate how consistently LLMs answer when the same molecule
    is given as a SMILES string versus an IUPAC name, and find low consistency even after mapped training
    and KL regularization, suggesting that LLMs may capture surface-level patterns rather than underlying chemistry.

- date: "Jul 26, 2024"
  html: >-
    Our <a href="https://pubs.rsc.org/en/content/articlepdf/2024/DD/D4DD00114A">CatScore paper</a>
    is out in <em>Digital Discovery</em>. We introduce CatScore, a learning-based metric for evaluating
    asymmetric catalysis in organic chemistry that enables efficient, effective assessment of diverse
    catalyst-design models at both the instance and system levels.
