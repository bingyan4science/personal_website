# Content pack for bingyan.me - "ask about my website" helper.
# A single "site" domain about Bing Yan (AI + Chemistry), with a baked answerer.
# Validate it with:  paw-helper validate --content helper

schema_version: 1

default_domain: site

# Page key the widget sends -> default domain. (One domain here, so no router.)
page_defaults:
  site: site

# Shared answer validator (checks the answer is on-topic for the question).
validator: validator

# Per-node-role generation budgets.
max_tokens:
  classifier: 8
  answerer: 320
  validator: 4

# Spec + input + output share this context window (a PAW constraint).
token_budget: 2048

# Resilience: validator "no"/empty -> graceful fallback, never a wrong answer.
resilience:
  backtrack: true

domains:
  site:
    classifier: page_classifier   # link label vs "question"
    links: links.yaml
    answerer: answerer
    facts_mode: runtime            # inject facts.md so content updates do not require recompiling
    context: site_facts
    classifier_redundancy:
      - to: askchem
        from: [question, papers, scholar]
        any_keywords: [askchem]
        unless_keywords: ["paper about", accepted, emnlp, reasonflow, claim, "147", "2.4"]
